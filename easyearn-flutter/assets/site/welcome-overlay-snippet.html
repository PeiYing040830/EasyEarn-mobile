<!-- EasyEarn file note: Builds the welcome overlay snippet page layout and connects it to shared styles/scripts. -->
<!-- Add before login.html </body> -->
<style>
  /* Welcome overlay mascot. logo.gif replaces the cute character with the app mascot. */
  .growth-mascot {
    position: relative;
    width: 260px;
    height: 260px;
    margin-bottom: 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%, rgba(255,255,255,.92) 0 45%, rgba(236,253,245,.72) 64%, rgba(34,197,94,.16) 100%);
    box-shadow:
      0 22px 44px rgba(8, 145, 178, 0.18),
      inset 0 0 0 1px rgba(34, 197, 94, 0.16);
    animation: logoMascotFloat 2.8s ease-in-out infinite;
    overflow: hidden;
  }

  /* Soft highlight layer over the mascot circle. It is decorative only. */
  .growth-mascot::after {
    content: "";
    position: absolute;
    inset: 16px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.45), transparent 48%);
    pointer-events: none;
  }

  /* object-fit: contain keeps the GIF inside the circle without cropping it. */
  .growth-mascot img {
    width: 218px;
    height: 218px;
    object-fit: contain;
    border-radius: 50%;
    transform: none;
    filter: drop-shadow(0 12px 18px rgba(15, 118, 110, 0.16));
  }

  @keyframes logoMascotFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.02); }
  }
</style>

<div id="login-loading-overlay" style="
  display:none; position:fixed; inset:0; z-index:9999;
  background:rgba(238,249,252,0.94); backdrop-filter:blur(8px);
  align-items:center; justify-content:center; flex-direction:column;
  overflow:hidden;
">
  <!-- loading.gif is a decorative pattern layer behind the mascot and text. -->
  <div aria-hidden="true" style="
    position:absolute; inset:0;
    background-image:url('images/loading.gif');
    background-repeat:repeat;
    background-position:center;
    background-size:432px 240px;
    opacity:.62;
    pointer-events:none;
  "></div>
  <!-- This content layer is above the loading.gif pattern. -->
  <div style="position:relative; z-index:1; display:flex; align-items:center;
    justify-content:center; flex-direction:column;">
    <div class="growth-mascot" aria-hidden="true">
      <img src="images/logo.gif" alt="">
    </div>
    <p style="margin-top:0; font-family:'Manrope',sans-serif;
      font-weight:700; font-size:18px; color:#0e7490;">
      Welcome back!
    </p>
    <p style="margin-top:4px; font-family:'Manrope',sans-serif;
      font-weight:500; font-size:13px; color:#475569;">
      Getting your dashboard ready...
    </p>
  </div>
</div>

<!-- Inline script runs page-specific JavaScript behavior. -->
<script>
  function showWelcomeOverlay(redirectUrl) {
    document.getElementById('login-loading-overlay').style.display = 'flex';
    setTimeout(() => {
      window.location.href = redirectUrl;
    }, 3800);
  }
</script>
