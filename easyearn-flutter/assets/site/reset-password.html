<!-- EasyEarn file note: Builds the reset password page layout and connects it to shared styles/scripts. -->
 <!DOCTYPE html>
<html lang="en">
<!-- Head section stores page settings, title, icons, and stylesheet links. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyEarn - Reset Password</title>
    <link rel="icon" type="image/png" href="/easyearn/images/logo.png?v=20260829b">
<link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/style.css?v=20260627d">
  <link rel="stylesheet" href="css/mobile-app.css?v=4">
</head>
<body class="auth-bg-page">
  <!-- Shared header/navigation is injected here by includes.js. -->
  <div id="site-header"></div>

  <div class="auth-container">
    <div class="auth-box" id="auth-box">

      <div id="error-msg" class="error-msg" style="display:none;"></div>
      <div id="success-msg" class="error-msg" style="display:none; background:#ecfdf5; color:#047857; border-color:#a7f3d0;"></div>

      <!-- Container for the auth panel content and layout. -->
      <div class="auth-panel active" id="panel-reset">
        <div class="auth-heading">
          <h1>Reset password</h1>
          <p>Enter a new password for your account</p>
        </div>
        <!-- Container for the form group content and layout. -->
        <div class="form-group">
          <label>New Password</label>
          <div class="password-field">
            <input type="password" id="new-password" placeholder="Min 6 characters + one of !@#$%^">
            <button class="password-toggle" type="button" data-toggle-target="new-password" aria-label="Show password">👀</button>
          </div>
        </div>
        <!-- Container for the form group content and layout. -->
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="password-field">
            <input type="password" id="confirm-new-password" placeholder="Re-enter your new password">
            <button class="password-toggle" type="button" data-toggle-target="confirm-new-password" aria-label="Show password">👀</button>
          </div>
        </div>
        <button class="btn-primary" id="reset-btn">Update Password</button>
        <p class="link-text"><a href="login.html">Back to login</a></p>
      </div>

    </div>
  </div>

  <!-- Loads translation support for multilingual users. -->
  <script src="js/translate.js" defer></script>
  <!-- Loads shared header and footer partials. -->
  <script src="js/includes.js?v=20260930b" defer></script>

  <!-- Inline script runs page-specific JavaScript behavior. -->
  <script type="module">
    import { supabase } from './js/supabase-config.js';

    function showError(msg) {
      const el = document.getElementById('error-msg');
      const ok = document.getElementById('success-msg');
      ok.style.display = 'none';
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('error-msg');
      const ok = document.getElementById('success-msg');
      el.style.display = 'none';
      ok.textContent = msg;
      ok.style.display = 'block';
    }

    function setupPasswordToggles() {
      const SHOW_EMOJI = String.fromCodePoint(0x1f440);
      const HIDE_EMOJI = String.fromCodePoint(0x1f648);

      document.querySelectorAll('.password-toggle').forEach((button) => {
        button.textContent = SHOW_EMOJI;
        button.addEventListener('click', () => {
          const targetId = button.getAttribute('data-toggle-target');
          const input = targetId ? document.getElementById(targetId) : null;
          if (!input) return;
          const shouldShow = input.type === 'password';
          input.type = shouldShow ? 'text' : 'password';
          button.textContent = shouldShow ? HIDE_EMOJI : SHOW_EMOJI;
        });
      });
    }

    async function handleResetPassword() {
      const password = document.getElementById('new-password')?.value.trim();
      const confirmPassword = document.getElementById('confirm-new-password')?.value.trim();

      if (!password || !confirmPassword) {
        showError('Please fill in both password fields.');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      if (!/[!@#$%^]/.test(password)) {
        showError('Password must contain at least one of !@#$%^.');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password });

      btn.disabled = false;
      btn.textContent = 'Update Password';

      if (error) {
        console.error('Password update failed:', error);
        showError('Could not update password. Your reset link may have expired — please request a new one.');
        return;
      }

      showSuccess('Password updated. Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    }

    setupPasswordToggles();
    document.getElementById('reset-btn')?.addEventListener('click', handleResetPassword);
  </script>
</body>
</html>
