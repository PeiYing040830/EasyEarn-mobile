<!DOCTYPE html>
<!-- EasyEarn file note: Builds the forgot password page layout and connects it to shared styles/scripts. -->
<html lang="en">
<!-- Head section stores page settings, title, icons, and stylesheet links. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyEarn - Forgot Password</title>
    <link rel="icon" type="image/png" href="/easyearn/images/logo.png?v=20260829b">
<link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/style.css?v=20260627d">
  <link rel="stylesheet" href="css/mobile-app.css?v=4">
</head>
<body class="auth-bg-page">
  <!-- Shared header/navigation is injected here by includes.js. -->
  <div id="site-header"></div>

  <div class="auth-container">
    <div class="auth-box" id="auth-box">

      <div id="error-msg" class="error-msg" style="display:none;"></div>
      <div id="success-msg" class="error-msg" style="display:none; background:#ecfdf5; color:#047857; border-color:#a7f3d0;"></div>

      <!-- Container for the auth panel content and layout. -->
      <div class="auth-panel active" id="panel-forgot">
        <div class="auth-heading">
          <h1>Forgot password</h1>
          <p>Enter your account email and we'll send you a reset link</p>
        </div>
        <!-- Container for the form group content and layout. -->
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="forgot-email" placeholder="Enter your email">
        </div>
        <button class="btn-primary" id="forgot-btn">Send Reset Link</button>
        <p class="link-text"><a href="login.html">Back to login</a></p>
      </div>

    </div>
  </div>

  <!-- Loads translation support for multilingual users. -->
  <script src="js/translate.js" defer></script>
  <!-- Loads shared header and footer partials. -->
  <script src="js/includes.js?v=20260930b" defer></script>

  <!-- Inline script runs page-specific JavaScript behavior. -->
  <script type="module">
    import { supabase } from './js/supabase-config.js';

    function showError(msg) {
      const el = document.getElementById('error-msg');
      const ok = document.getElementById('success-msg');
      ok.style.display = 'none';
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showSuccess(msg) {
      const el = document.getElementById('error-msg');
      const ok = document.getElementById('success-msg');
      el.style.display = 'none';
      ok.textContent = msg;
      ok.style.display = 'block';
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgot-email')?.value.trim();

      if (!email) {
        showError('Please enter your email.');
        return;
      }

      const btn = document.getElementById('forgot-btn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const redirectTo = `${window.location.origin}${window.location.pathname.replace('forgot-password.html', 'reset-password.html')}`;

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo
      });

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      if (error) {
        console.error('Reset request failed:', error);
        showError('Could not send reset link. Please check the email and try again.');
        return;
      }

      showSuccess('If an account exists for that email, a reset link has been sent. Please check your inbox.');
    }

    document.getElementById('forgot-btn')?.addEventListener('click', handleForgotPassword);
  </script>
</body>
</html>
